name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: noise-exposure-backend-dev

jobs:
  test-backend:
    name: Test back end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint template.yaml
      - run: python -m unittest discover -s tests -v

  test-app:
    name: Test app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noisesense-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  deploy-backend:
    name: Deploy back end
    needs: [test-backend, test-app]   # nothing deploys unless every test passed
    runs-on: ubuntu-latest
    outputs:
      user_pool_id: ${{ steps.outputs.outputs.user_pool_id }}
      client_id: ${{ steps.outputs.outputs.client_id }}
      api_url: ${{ steps.outputs.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aws-sam-cli
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sam build --use-container
      - run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvName=dev \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              AlertEmail=${{ secrets.ALERT_EMAIL }}
      - name: Read stack outputs for the app build
        id: outputs
        run: |
          get() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "user_pool_id=$(get UserPoolId)" >> "$GITHUB_OUTPUT"
          echo "client_id=$(get UserPoolClientId)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(get ApiBaseUrl)" >> "$GITHUB_OUTPUT"

  build-app:
    name: Build and publish app
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    defaults:
      run:
        working-directory: noisesense-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write signing key (from secrets; never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Strip line breaks and spaces added when the secret was pasted.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/upload-keystore.jks
          # Fail clearly if the secret did not decode to a usable keystore.
          echo "Decoded keystore: $(wc -c < android/app/upload-keystore.jks) bytes"
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            || { echo "::error::keytool rejected the keystore (see message above): check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."; exit 1; }
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Choose version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build release APK against the stack just deployed
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=AWS_REGION=${{ env.AWS_REGION }} \
            --dart-define=USER_POOL_ID=${{ needs.deploy-backend.outputs.user_pool_id }} \
            --dart-define=USER_POOL_CLIENT_ID=${{ needs.deploy-backend.outputs.client_id }} \
            --dart-define=API_BASE_URL=${{ needs.deploy-backend.outputs.api_url }}
          apk="NoiseSense-${{ steps.version.outputs.name }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Remove signing key from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: NoiseSense-${{ steps.version.outputs.name }}
          path: |
            noisesense-app/NoiseSense-*.apk
            noisesense-app/NoiseSense-*.apk.sha256

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" NoiseSense-*.apk NoiseSense-*.apk.sha256 \
            --title "NoiseSense $GITHUB_REF_NAME" \
            --notes "Signed Android build of commit ${GITHUB_SHA::7}, built against stack $STACK_NAME in $AWS_REGION. Test devices only."
